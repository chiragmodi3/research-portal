<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Research Portal - Financial Extractor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        .drop-area {
            border: 2px dashed #2f80ed;
            padding: 30px;
            margin: 20px 0;
            border-radius: 8px;
            cursor: pointer;
            color: #555;
        }

        .drop-area:hover {
            background: #f0f6ff;
        }

        button {
            background: #2f80ed;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1c6ed5;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>📊 Research Portal</h2>
        <p>Financial Statement Extraction Tool</p>

        <div class="drop-area" id="dropArea">
            Drag & Drop PDF here<br>
            or Click to Select
            <input type="file" id="fileInput" hidden />
        </div>

        <button onclick="uploadFile()">Extract to Excel</button>

        <div class="status" id="status"></div>

    </div>

    <script>

        const dropArea = document.getElementById("dropArea");
        const fileInput = document.getElementById("fileInput");

        dropArea.onclick = () => fileInput.click();

        dropArea.addEventListener("dragover", e => {
            e.preventDefault();
            dropArea.style.background = "#eaf3ff";
        });

        dropArea.addEventListener("dragleave", () => {
            dropArea.style.background = "white";
        });

        dropArea.addEventListener("drop", e => {
            e.preventDefault();
            fileInput.files = e.dataTransfer.files;
            dropArea.innerText = fileInput.files[0].name;
        });

        fileInput.addEventListener("change", () => {
            dropArea.innerText = fileInput.files[0].name;
        });

        async function uploadFile() {

            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a file");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            document.getElementById("status").innerText = "⏳ Processing... please wait";

            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "financial_output.xlsx";
            a.click();

            document.getElementById("status").innerText = "✅ Excel Downloaded!";
        }

    </script>

</body>

</html>
